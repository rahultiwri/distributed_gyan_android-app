name: Distributor_demand
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  uuid: ^4.5.1
  sqflite: ^2.4.2
  path: ^1.9.1
  speech_to_text: ^7.0.0
  auto_datetime: ^0.0.2
  app_settings: ^9.0.0
  image_picker: ^1.2.0




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Launcher Icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icons.png"

# Native Splash
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/gyan_splash_logo_final.png

  android: true
  ios: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/gyan_splash_logo_final.png